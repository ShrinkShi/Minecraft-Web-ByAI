name: Mobile landscape integration patch
on:
  push:
    branches: [feat/v0.4-mobile-landscape-controls]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-mobile-landscape-controls
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/patch-mobile-landscape.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          set -e
          for file in src/*.js; do node --check "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          node --check tests/e2e/mobile.spec.mjs
          npm run test:logic
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.css package.json src/device-profile.js src/mobile-controls.js src/player.js src/ui.js src/main.js scripts/check-mobile.mjs tests/e2e/mobile.spec.mjs
          git commit -m "mobile: add landscape touch controls and device detection"
          git push origin HEAD:refs/heads/feat/v0.4-mobile-landscape-controls
