name: Temporary patch vanilla tool sounds

on:
  push:
    branches:
      - content/v0.4-iron-hoe-secondary-actions
    paths:
      - .github/workflows/patch-vanilla-tool-sounds.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/v0.4-iron-hoe-secondary-actions
          fetch-depth: 0
      - name: Patch main.js exact anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/main.js')
          text=path.read_text(encoding='utf-8')
          import_anchor="import {resolveToolSecondaryAction,toolActionFaceY} from './tool-secondary-actions.js';\n"
          import_replacement=import_anchor+"import {playToolSecondaryActionSound} from './vanilla-sounds.js';\n"
          if text.count(import_anchor)!=1:
              raise SystemExit(f'import anchor count={text.count(import_anchor)}')
          if "import {playToolSecondaryActionSound} from './vanilla-sounds.js';" not in text:
              text=text.replace(import_anchor,import_replacement,1)
          action_anchor="const verb=toolAction.kind==='till'?'耕作':toolAction.kind==='strip'?'剥皮':'铲平';ui.showToast(`${verb} ${BLOCKS[hit.id]?.name||'方块'}`);markSaveDirty();"
          action_replacement="void playToolSecondaryActionSound(toolAction.kind,{volume:.8});"+action_anchor
          if text.count(action_anchor)!=1:
              raise SystemExit(f'action anchor count={text.count(action_anchor)}')
          if "void playToolSecondaryActionSound(toolAction.kind,{volume:.8});" not in text:
              text=text.replace(action_anchor,action_replacement,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- src/main.js; then
            echo "main.js already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "audio: play original sounds for secondary tool actions"
          git push origin HEAD:content/v0.4-iron-hoe-secondary-actions
