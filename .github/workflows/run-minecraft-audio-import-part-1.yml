name: Run Minecraft audio import part 1

on:
  pull_request:
    branches:
      - main

env:
  IMPORT_BRANCH: ${{ github.event.pull_request.head.ref }}

permissions:
  contents: write

jobs:
  import:
    # Temporary PR-only driver. Removed after the exact import succeeds.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Import and verify exact uploaded object set
        shell: bash
        run: |
          set -euo pipefail
          python .github/import-minecraft-audio-part-1.py
