name: Fix save schema browser assertions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/coal-progression
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Align save-schema browser assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/smoke.spec.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("return{version:record.version,chest:", "return{version:record.version,terrainVersion:record.terrainVersion,chest:", 1),
              (".toEqual({version:7,chest:'leather_chestplate',weather:'clear',hasTransientAir:false});", ".toEqual({version:8,terrainVersion:3,chest:'leather_chestplate',weather:'clear',hasTransientAir:false});", 1),
              ("return{version:record.version,x:Number(record.respawnPoint.x.toFixed(2))", "return{version:record.version,terrainVersion:record.terrainVersion,x:Number(record.respawnPoint.x.toFixed(2))", 1),
              ("spawnpoint should persist in a fresh v7 world snapshot", "spawnpoint should persist in a fresh v8 terrain-v3 world snapshot", 1),
              (".toEqual({version:7,...custom});", ".toEqual({version:8,terrainVersion:3,...custom});", 1),
              ("return{version:record.version,validPair:", "return{version:record.version,terrainVersion:record.terrainVersion,validPair:", 2),
              (".toEqual({version:7,validPair:true,hasRespawn:true});", ".toEqual({version:8,terrainVersion:3,validPair:true,hasRespawn:true});", 2),
          ]
          for old, new, expected_count in replacements:
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(f'anchor count mismatch for {old!r}: expected {expected_count}, got {count}')
              text = text.replace(old, new)
          if 'version:7' in text or 'fresh v7' in text:
              raise SystemExit('stale v7 browser save assertion remains')
          path.write_text(text, encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: node --check tests/e2e/smoke.spec.mjs
      - name: Verify schema assertions
        run: |
          grep -q "version:8,terrainVersion:3" tests/e2e/smoke.spec.mjs
          ! grep -q "version:7" tests/e2e/smoke.spec.mjs
      - name: Commit fix and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-save-schema-e2e.yml
          git add tests/e2e/smoke.spec.mjs
          git commit -m 'test: assert singleplayer save schema v8 in browser smoke'
          git push origin HEAD:feature/coal-progression
