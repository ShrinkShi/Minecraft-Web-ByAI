name: Unified control integration patch
on:
  push:
    branches: [refactor/v0.4-unified-control-intents]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/v0.4-unified-control-intents
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/patch-unified-controls.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          set -e
          for file in src/*.js; do node --check "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          node --check tests/e2e/smoke.spec.mjs
          node --check tests/e2e/mobile.spec.mjs
          npm run test:logic
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "input: route desktop and touch through shared control intents"
          git push origin HEAD:refs/heads/refactor/v0.4-unified-control-intents
