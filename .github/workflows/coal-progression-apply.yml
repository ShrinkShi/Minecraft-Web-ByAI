name: Apply coal progression

on:
  push:
    branches: [feature/coal-progression]
    paths:
      - 'tools/apply-coal-progression.py'
      - 'tools/fix-coal-bootstrap.py'
      - '.github/workflows/coal-progression-apply.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply-coal-progression.py'
      - 'tools/fix-coal-bootstrap.py'
      - '.github/workflows/coal-progression-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/coal-progression
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Tighten bootstrap anchors
        run: python tools/fix-coal-bootstrap.py
      - name: Apply coal progression source patch
        run: python tools/apply-coal-progression.py
      - name: Install pinned asset dependency
        run: python -m pip install -r tools/requirements-assets.txt
      - name: Regenerate deterministic runtime source and atlas
        run: |
          python tools/import-minecraft-assets.py
          python tools/build-minecraft-runtime-assets.py
          cp build/minecraft-runtime-assets/textures/atlas.png assets/textures/atlas.png
          cp build/minecraft-runtime-assets/minecraft/runtime-manifest.json assets/minecraft/runtime-manifest.json
          cp build/minecraft-runtime-source/source-manifest.json assets/minecraft/source-manifest.json
      - name: JavaScript syntax
        run: |
          set -e
          for file in src/*.js; do node --check "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          for file in server/*.mjs; do node --check "$file"; done
      - name: Install runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Logic/server/worker regressions
        run: npm run test:logic
      - name: Commit generated delivery and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply-coal-progression.py tools/fix-coal-bootstrap.py .github/workflows/coal-progression-apply.yml
          git add -A
          git commit -m 'feat: add coal progression and terrain v3'
          git push origin HEAD:feature/coal-progression
