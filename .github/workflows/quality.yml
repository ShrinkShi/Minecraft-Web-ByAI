name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install logic/server runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: JavaScript syntax
        run: |
          set -e
          for file in src/*.js; do node --check "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          for file in server/*.mjs; do node --check "$file"; done
      - name: Logic and worker regression checks
        run: npm run test:logic

  browser-smoke:
    needs: static-checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (${{ matrix.shard }})
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-smoke-artifacts-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  import-complete-minecraft-audio:
    if: github.head_ref == 'agent/import-minecraft-audio-part-1' && github.actor != 'github-actions[bot]'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      IMPORT_BRANCH: agent/import-minecraft-audio-part-1
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Import and verify complete two-part object set
        run: python .github/import-minecraft-audio-part-1.py
      - name: Restore repository quality workflow to main version
        if: success()
        run: |
          set -e
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality.yml
          git add -- .github/workflows/quality.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore repository quality workflow after asset import"
            git push origin HEAD:${IMPORT_BRANCH}
          fi
