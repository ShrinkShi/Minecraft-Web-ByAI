name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install logic/server runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: JavaScript syntax
        run: |
          set -e
          for file in src/*.js; do node --check "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          for file in server/*.mjs; do node --check "$file"; done
      - name: Logic and worker regression checks
        run: npm run test:logic
      - name: Install Godot 4.7.2 stable
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/godot.zip \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2'
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"
          ln -s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
      - name: Godot native headless smoke
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file' /tmp/godot-smoke.log; then
            echo 'Godot native smoke reported parser/resource errors.' >&2
            exit 1
          fi

  browser-smoke:
    needs: static-checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (${{ matrix.shard }})
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-smoke-artifacts-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
