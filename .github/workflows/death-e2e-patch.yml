name: One-shot death E2E patch
on:
  push:
    branches: [feat/v0.4-death-screen]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-death-screen
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch browser death regression
        run: python scripts/patch-death-e2e.py
      - name: Remove one-shot patch files
        run: rm scripts/patch-death-e2e.py .github/workflows/death-e2e-patch.yml
      - name: Commit patched browser regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke.spec.mjs scripts/patch-death-e2e.py .github/workflows/death-e2e-patch.yml
          git commit -m "test: require explicit respawn after death"
          git push origin HEAD:feat/v0.4-death-screen
