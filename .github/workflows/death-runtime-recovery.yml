name: Recover death runtime
on:
  push:
    branches: [fix/v0.4-death-screen-main-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.4-death-screen-main-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch explicit death lifecycle
        run: python scripts/patch-death-main.py
      - name: Verify patched runtime syntax
        run: node --check src/main.js
      - name: Commit patched runtime only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "fix: restore explicit death runtime"
          git push origin HEAD:refs/heads/fix/v0.4-death-screen-main-recovery
