name: Deterministic E2E look patch
on:
  push:
    branches: [fix/v0.4-deterministic-e2e-look]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.4-deterministic-e2e-look
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/patch-deterministic-e2e-look.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          node --check src/player.js
          node --check src/main.js
          node --check tests/e2e/smoke.spec.mjs
          npm run test:logic
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/player.js src/main.js tests/e2e/smoke.spec.mjs
          git commit -m "test: make bed aim deterministic under Playwright"
          git push origin HEAD:refs/heads/fix/v0.4-deterministic-e2e-look
