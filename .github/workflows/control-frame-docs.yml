name: Sync control frame docs
on:
  push:
    branches: [refactor/v0.4-platform-neutral-control-frame]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/v0.4-platform-neutral-control-frame
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/patch-control-frame-docs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/PROGRESS.md docs/FILE_MANIFEST.md
          git commit -m "docs: record platform-neutral control frame"
          git push origin HEAD:refs/heads/refactor/v0.4-platform-neutral-control-frame
