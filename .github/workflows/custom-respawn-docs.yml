name: Sync custom respawn docs
on:
  push:
    branches: [feat/v0.4-custom-respawn-point]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-custom-respawn-point
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch custom respawn docs
        run: python scripts/patch-custom-respawn-docs.py
      - name: Commit documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/ARCHITECTURE.md docs/PROGRESS.md docs/TESTING.md docs/FILE_MANIFEST.md
          git commit -m "docs: record persistent custom respawn"
          git push origin HEAD:refs/heads/feat/v0.4-custom-respawn-point
