name: Apply hunger food core

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-hunger-food-core.py
      - .github/workflows/hunger-food-core-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/hunger-food-core'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply integration patch
        run: python tools/apply-hunger-food-core.py
      - name: Fix one-item hotbar assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/hunger-food.spec.mjs')
          s=p.read_text(encoding='utf-8')
          old="await expect(page.locator('#hotbar [data-hotbar-index=\"0\"] .slot-count')).toHaveText('1');"
          if s.count(old)!=2:
              raise SystemExit(f'expected two one-item count assertions, found {s.count(old)}')
          s=s.replace(old,"await expect(page.locator('#hotbar [data-hotbar-index=\"0\"]')).toHaveAttribute('title','面包');")
          p.write_text(s,encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: |
          node --check src/hunger-rules.js
          node --check src/items.js
          node --check src/player.js
          node --check src/main.js
          node --check src/smelting.js
          node --check src/world-save-compatibility.js
          node --check scripts/check-hunger-food.mjs
          node --check scripts/check-singleplayer-terrain-version.mjs
          node --check tests/e2e/hunger-food.spec.mjs
          node --check tests/e2e/smoke.spec.mjs
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Logic and server regressions
        run: npm run test:logic
      - name: Verify integration boundary
        run: |
          test -f 'MC原版素材assets/minecraft/textures/item/apple.png'
          test -f 'MC原版素材assets/minecraft/textures/item/bread.png'
          test -f 'MC原版素材assets/minecraft/textures/item/cooked_beef.png'
          test -f 'MC原版素材assets/minecraft/textures/item/cooked_mutton.png'
          test -f 'MC原版素材assets/minecraft/textures/item/cooked_porkchop.png'
          test -f 'MC原版素材assets/minecraft/textures/item/cooked_chicken.png'
          ! grep -R "version:8,terrainVersion:3" tests/e2e
          grep -q "SINGLEPLAYER_SAVE_VERSION=9" src/world-save-compatibility.js
          grep -q "TERRAIN_VERSIONED_SAVE_MIN_VERSION=8" src/world-save-compatibility.js
      - name: Commit integration and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/hunger-rules.js \
            src/items.js \
            src/asset-manifest.js \
            src/smelting.js \
            src/player.js \
            src/world-save-compatibility.js \
            src/main.js \
            scripts/check-singleplayer-terrain-version.mjs \
            scripts/check-asset-manifest.mjs \
            scripts/check-hunger-food.mjs \
            tests/e2e/smoke.spec.mjs \
            tests/e2e/hunger-food.spec.mjs \
            docs/PROJECT_BASELINE.md
          git rm -- tools/apply-hunger-food-core.py .github/workflows/hunger-food-core-apply.yml
          git diff --cached --check
          git status --short
          git commit -m 'feat: integrate hunger and food core'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
