name: Patch custom respawn runtime
on:
  push:
    branches: [feat/v0.4-custom-respawn-point]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-custom-respawn-point
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch runtime and browser coverage
        run: python scripts/patch-custom-respawn.py
      - name: Verify JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/player.js
          node --check src/commands.js
          node --check tests/e2e/smoke.spec.mjs
      - name: Run respawn rules
        run: node scripts/check-respawn.mjs
      - name: Commit product/test files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/player.js scripts/check.mjs tests/e2e/smoke.spec.mjs
          git commit -m "survival: wire persistent custom respawn points"
          git push origin HEAD:refs/heads/feat/v0.4-custom-respawn-point
