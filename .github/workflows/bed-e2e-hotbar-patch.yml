name: Patch bed E2E hotbar flow
on:
  push:
    branches: [feat/v0.4-bed-respawn-anchor]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-bed-respawn-anchor
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch real inventory to hotbar flow
        run: python scripts/patch-bed-e2e-hotbar.py
      - name: Verify E2E syntax
        run: node --check tests/e2e/smoke.spec.mjs
      - name: Commit test only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke.spec.mjs
          git commit -m "test: move bed through the real inventory hotbar flow"
          git push origin HEAD:refs/heads/feat/v0.4-bed-respawn-anchor
