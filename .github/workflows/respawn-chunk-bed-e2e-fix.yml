name: Fix respawn chunk and bed E2E
on:
  push:
    branches: [fix/v0.4-respawn-chunk-bed-e2e]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.4-respawn-chunk-bed-e2e
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch runtime and browser regression
        run: python scripts/patch-respawn-chunk-bed-e2e.py
      - name: Verify syntax and respawn contract
        run: |
          node --check src/world.js
          node --check src/main.js
          node --check tests/e2e/smoke.spec.mjs
          node scripts/check-respawn.mjs
      - name: Commit product/test files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world.js src/main.js scripts/check-respawn.mjs tests/e2e/smoke.spec.mjs
          git commit -m "fix: load respawn chunks before safety resolution"
          git push origin HEAD:refs/heads/fix/v0.4-respawn-chunk-bed-e2e
