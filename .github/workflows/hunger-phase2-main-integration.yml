# Bootstrap is self-deleting after a successful integration run.
name: Hunger phase 2 main integration

on:
  push:
    branches:
      - feature/hunger-phase-2-use-duration
    paths:
      - .github/workflows/hunger-phase2-main-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hunger-phase-2-use-duration
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Patch gameplay integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('src/main.js')
          text=path.read_text(encoding='utf-8')

          def once(value,old,new,label):
              count=value.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return value.replace(old,new,1)

          text=once(text,
              "import {SingleplayerVegetationRuntime} from './singleplayer-vegetation-runtime.js';\n",
              "import {SingleplayerVegetationRuntime} from './singleplayer-vegetation-runtime.js';\nimport {SingleplayerFoodUseRuntime} from './singleplayer-food-use-runtime.js';\nimport {publishFirstPersonUseState} from './first-person-action-channel.js';\n",
              'imports')

          text=once(text,
              "let deviceProfile=detectDeviceProfile(),desktopControls=null,mobileControls=null,gameplayRuntime=null,singleplayerFurnace=null,singleplayerFarming=null,singleplayerVegetation=null;",
              "let deviceProfile=detectDeviceProfile(),desktopControls=null,mobileControls=null,gameplayRuntime=null,singleplayerFurnace=null,singleplayerFarming=null,singleplayerVegetation=null,singleplayerFoodUse=null;",
              'runtime variable')

          text=once(text,
              "  onPrimary:pressed=>{if(sessionKind==='multiplayer'){if(pressed&&canControl())ui.showToast('联机方块/战斗权威尚未接入，当前禁止本地攻击或破坏');return;}if(pressed)primaryActionStart();else primaryActionEnd();},\n  onAction:intent=>handleControlIntent(intent)",
              "  onPrimary:pressed=>{if(sessionKind==='multiplayer'){if(pressed&&canControl())ui.showToast('联机方块/战斗权威尚未接入，当前禁止本地攻击或破坏');return;}if(pressed)primaryActionStart();else primaryActionEnd();},\n  onSecondary:pressed=>handleSecondaryInput(pressed),\n  onAction:intent=>handleControlIntent(intent)",
              'secondary callback')

          text=once(text,
              "worldBlock:(x,y,z)=>world?.getBlock(x,y,z)??null,playerVitals:",
              "worldBlock:(x,y,z)=>world?.getBlock(x,y,z)??null,foodUse:()=>singleplayerFoodUse?.snapshot()||null,selectedStack:()=>{const stack=ui.selectedItem();return stack?{...stack}:null;},playerVitals:",
              'e2e food hooks')

          text=once(text,
              "running=false;clearPlayerInput();const movement=multiplayerMovement;multiplayerMovement=null;multiplayerStarting=false;singleplayerVegetation?.dispose();singleplayerVegetation=null;singleplayerFarming?.dispose();",
              "running=false;clearPlayerInput();const movement=multiplayerMovement;multiplayerMovement=null;multiplayerStarting=false;singleplayerFoodUse?.dispose();singleplayerFoodUse=null;publishFirstPersonUseState({active:false});singleplayerVegetation?.dispose();singleplayerVegetation=null;singleplayerFarming?.dispose();",
              'dispose food runtime')

          text=once(text,
              "  singleplayerVegetation=new SingleplayerVegetationRuntime({world,getMode:()=>player?.mode||'spectator',onChanged:markSaveDirty,onDrop:(stack,target)=>drops?.spawnStack(stack,new THREE.Vector3(target.x+.5,target.y+.35,target.z+.5))});\n  const needsTerrainMetadataMigration=",
              "  singleplayerVegetation=new SingleplayerVegetationRuntime({world,getMode:()=>player?.mode||'spectator',onChanged:markSaveDirty,onDrop:(stack,target)=>drops?.spawnStack(stack,new THREE.Vector3(target.x+.5,target.y+.35,target.z+.5))});\n  singleplayerFoodUse=new SingleplayerFoodUseRuntime({\n    getMode:()=>player?.mode||'spectator',getSelectedStack:()=>ui.selectedItem(),\n    canStart:(_itemId,food)=>!!player&&(player.hunger<20||food.alwaysEdible),\n    complete:(itemId,food)=>{\n      if(!player||player.mode!=='survival')return{consumed:false,reason:'mode-invalid'};const selected=ui.selectedItem();if(!selected||selected.id!==itemId||selected.count<1)return{consumed:false,reason:'item-changed'};\n      const before=player.hungerState(),eaten=player.eat(food);if(!eaten.consumed)return{consumed:false,reason:'not-edible'};const removed=ui.consumeSelected(1);if(!removed){player.applyHungerState(before);return{consumed:false,reason:'item-changed'};}\n      markSaveDirty();renderPlayerStatus();ui.showToast(`食用 ${ITEMS[itemId]?.name||itemId}`);return eaten;\n    },\n    onState:state=>publishFirstPersonUseState(state.active?{active:true,kind:'food',itemId:state.itemId,progress:state.progress}:{active:false})\n  });\n  const needsTerrainMetadataMigration=",
              'create food runtime')

          text=once(text,
              "function multiplayerUnsupported(message){ui.showToast(message);return false;}",
              "function handleSecondaryInput(pressed){\n  if(sessionKind==='multiplayer'){if(pressed&&canControl())multiplayerUnsupported('联机食物/放置/使用权威尚未接入');return false;}\n  if(!pressed){singleplayerFoodUse?.cancel('released');return true;}if(!canControl())return false;secondaryAction();return true;\n}\nfunction multiplayerUnsupported(message){ui.showToast(message);return false;}",
              'secondary input handler')

          text=once(text,
              "  if(name==='hotbar-select'){if(!running||!Number.isInteger(payload?.index)||payload.index<0||payload.index>8)return false;ui.select(payload.index);sendMultiplayerHotbar();return true;}\n  if(name==='hotbar-step'){if(!running||ui.hasOpenPanel()||!Number.isFinite(payload?.step))return false;ui.select(ui.selected+(payload.step>0?1:-1));sendMultiplayerHotbar();return true;}\n  if(name==='secondary'){if(sessionKind==='multiplayer')return multiplayerUnsupported('联机放置/使用权威尚未接入');if(!canControl())return false;secondaryAction();return true;}return false;",
              "  if(name==='hotbar-select'){if(!running||!Number.isInteger(payload?.index)||payload.index<0||payload.index>8)return false;singleplayerFoodUse?.cancel('hotbar-changed');ui.select(payload.index);sendMultiplayerHotbar();return true;}\n  if(name==='hotbar-step'){if(!running||ui.hasOpenPanel()||!Number.isFinite(payload?.step))return false;singleplayerFoodUse?.cancel('hotbar-changed');ui.select(ui.selected+(payload.step>0?1:-1));sendMultiplayerHotbar();return true;}\n  if(name==='secondary'){if(sessionKind==='multiplayer')return multiplayerUnsupported('联机放置/使用权威尚未接入');if(!canControl())return false;secondaryAction();singleplayerFoodUse?.cancel('legacy-pulse');return true;}return false;",
              'hotbar and legacy secondary')

          text=once(text,
              "function primaryActionStart(){\n  if(sessionKind==='multiplayer'){ui.showToast('联机方块/战斗权威尚未接入');return;}if(!canControl()||!player||player.mode==='spectator')return;const entityHit=aimEntity(),blockHit=aim();",
              "function primaryActionStart(){\n  singleplayerFoodUse?.cancel('primary-action');if(sessionKind==='multiplayer'){ui.showToast('联机方块/战斗权威尚未接入');return;}if(!canControl()||!player||player.mode==='spectator')return;const entityHit=aimEntity(),blockHit=aim();",
              'attack cancels food')

          old_food="if(player.mode==='survival'&&def?.food){const eaten=player.eat(def.food);if(!eaten.consumed){ui.showToast('饥饿值已满');return;}ui.consumeSelected(1);markSaveDirty();renderPlayerStatus();ui.showToast(`食用 ${def.name}`);return;}"
          new_food="if(player.mode==='survival'&&def?.food){const started=singleplayerFoodUse?.start(selected.id,def.food);if(!started?.started&&started?.reason==='not-edible')ui.showToast('饥饿值已满');return;}"
          text=once(text,old_food,new_food,'food interaction')

          text=once(text,
              "world.ensureAround(player.position.x,player.position.z);interaction(now);updateSurvival(dt);updateOxygen(dt,now);",
              "world.ensureAround(player.position.x,player.position.z);interaction(now);singleplayerFoodUse?.update(dt);updateSurvival(dt);updateOxygen(dt,now);",
              'food runtime tick')

          path.write_text(text,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate syntax and logic
        run: |
          node --check src/main.js
          npm run test:logic
      - name: Commit integration and self-delete bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hunger-phase2-main-integration.yml
          git add src/main.js
          git diff --cached --check
          git commit -m "feat: integrate timed singleplayer food use"
          git push
