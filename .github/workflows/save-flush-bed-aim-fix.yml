name: Fix save flush and bed aim
on:
  push:
    branches: [fix/v0.4-save-flush-bed-aim]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.4-save-flush-bed-aim
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch runtime and E2E
        run: python scripts/patch-save-flush-bed-aim.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify syntax and existing logic suites
        run: |
          node --check src/main.js
          node --check tests/e2e/smoke.spec.mjs
          npm run test:logic
      - name: Commit product/test files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js tests/e2e/smoke.spec.mjs
          git commit -m "fix: drain saves and search bed placement surfaces"
          git push origin HEAD:refs/heads/fix/v0.4-save-flush-bed-aim
