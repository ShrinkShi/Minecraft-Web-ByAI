name: One-shot recoverable XP docs patch
on:
  push:
    branches: [test/v0.4-recoverable-death-xp]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/v0.4-recoverable-death-xp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch recoverable XP documentation
        run: python scripts/patch-recoverable-xp-docs.py
      - name: Remove one-shot patch files
        run: rm scripts/patch-recoverable-xp-docs.py .github/workflows/recoverable-xp-docs-patch.yml
      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/ARCHITECTURE.md docs/PROGRESS.md docs/TESTING.md docs/FILE_MANIFEST.md scripts/patch-recoverable-xp-docs.py .github/workflows/recoverable-xp-docs-patch.yml
          git commit -m "docs: record recoverable death XP closure"
          git push origin HEAD:test/v0.4-recoverable-death-xp
