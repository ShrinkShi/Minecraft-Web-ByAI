name: Apply farming phase one

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply-farming-phase-1.py'
      - 'tools/run-farming-bootstrap-v2.py'
      - '.github/workflows/farming-phase-1-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/farming-phase-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/farming-phase-1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply farming integration patch
        run: python tools/run-farming-bootstrap-v2.py
      - name: JavaScript syntax before generated outputs
        run: |
          for file in src/*.js scripts/*.mjs server/*.mjs; do node --check "$file"; done
      - name: Install asset build dependencies
        run: python -m pip install -r tools/requirements-assets.txt
      - name: Rebuild canonical model/runtime outputs
        run: |
          python tools/import-minecraft-assets.py
          python tools/build-minecraft-model-atlas.py
          python tools/build-minecraft-runtime-assets.py
          rm -rf assets/minecraft/blockstates assets/minecraft/models/block
          mkdir -p assets/minecraft/models assets/model-textures
          cp -R build/minecraft-runtime-assets/minecraft/blockstates assets/minecraft/blockstates
          cp -R build/minecraft-runtime-assets/minecraft/models/block assets/minecraft/models/block
          cp build/minecraft-runtime-source/source-manifest.json assets/minecraft/source-manifest.json
          cp build/minecraft-runtime-assets/minecraft/runtime-manifest.json assets/minecraft/runtime-manifest.json
          cp build/minecraft-model-atlas/model-texture-atlas.png assets/model-textures/model-texture-atlas.png
          cp build/minecraft-model-atlas/model-texture-atlas.json assets/model-textures/model-texture-atlas.json
      - name: Install runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Full logic server worker and asset regressions
        run: npm run test:logic
      - name: Verify generated farming model boundary
        run: |
          python tools/check_minecraft_model_closure.py
          python tools/check_minecraft_model_direct_face.py
          python tools/check_minecraft_model_atlas.py
          test -f assets/minecraft/blockstates/farmland.json
          test -f assets/minecraft/blockstates/wheat.json
          test -f assets/minecraft/models/block/farmland_moist.json
          test -f assets/minecraft/models/block/wheat_stage7.json
          node scripts/check-farming-phase-1.mjs
          node scripts/check-asset-manifest.mjs
      - name: Commit integration and remove bootstrap files
        run: |
          rm tools/apply-farming-phase-1.py tools/run-farming-bootstrap-v2.py .github/workflows/farming-phase-1-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/blocks.js src/items.js src/asset-manifest.js src/recipes.js src/minecraft-model-registry.js src/singleplayer-mining-controller.js src/main.js tools/minecraft_model_acceptance.py scripts/check-asset-manifest.mjs scripts/check-minecraft-runtime-assets.mjs scripts/check-minecraft-model-runtime.mjs scripts/check-minecraft-model-texture-binding.mjs assets/minecraft/blockstates assets/minecraft/models/block assets/minecraft/source-manifest.json assets/minecraft/runtime-manifest.json assets/model-textures/model-texture-atlas.png assets/model-textures/model-texture-atlas.json tools/apply-farming-phase-1.py tools/run-farming-bootstrap-v2.py .github/workflows/farming-phase-1-apply.yml
          git diff --cached --check
          git commit -m "feat: integrate wheat farming phase one"
          git push origin HEAD:feature/farming-phase-1
