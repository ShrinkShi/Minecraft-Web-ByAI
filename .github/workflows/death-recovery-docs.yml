name: Sync death recovery docs
on:
  push:
    branches: [fix/v0.4-death-screen-main-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.4-death-screen-main-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch recovery documentation
        run: python scripts/patch-death-recovery-docs.py
      - name: Commit documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/TESTING.md docs/FILE_MANIFEST.md
          git commit -m "docs: record death mainline recovery"
          git push origin HEAD:refs/heads/fix/v0.4-death-screen-main-recovery
