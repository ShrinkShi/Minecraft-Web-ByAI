name: One-shot death documentation patch
on:
  push:
    branches: [feat/v0.4-death-screen]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-death-screen
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch death documentation
        run: python scripts/patch-death-docs.py
      - name: Remove one-shot patch files
        run: rm scripts/patch-death-docs.py .github/workflows/death-docs-patch.yml
      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/ARCHITECTURE.md docs/PROGRESS.md docs/TESTING.md docs/FILE_MANIFEST.md scripts/patch-death-docs.py .github/workflows/death-docs-patch.yml
          git commit -m "docs: record explicit death screen and respawn"
          git push origin HEAD:feat/v0.4-death-screen
