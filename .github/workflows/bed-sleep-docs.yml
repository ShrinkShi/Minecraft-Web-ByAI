name: Sync bed sleep docs
on:
  push:
    branches: [survival/v0.4-bed-sleep-night-skip]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: survival/v0.4-bed-sleep-night-skip
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/patch-bed-sleep-docs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/ARCHITECTURE.md docs/PROGRESS.md docs/TESTING.md docs/FILE_MANIFEST.md
          git commit -m "docs: record shared bed sleep and night skip"
          git push origin HEAD:refs/heads/survival/v0.4-bed-sleep-night-skip
