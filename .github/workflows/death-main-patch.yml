name: One-shot death main patch
on:
  push:
    branches: [feat/v0.4-death-screen]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-death-screen
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch main death lifecycle
        run: python scripts/patch-death-main.py
      - name: Remove one-shot patch files
        run: rm scripts/patch-death-main.py .github/workflows/death-main-patch.yml
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js scripts/patch-death-main.py .github/workflows/death-main-patch.yml
          git commit -m "survival: split death settlement from respawn"
          git push origin HEAD:feat/v0.4-death-screen
