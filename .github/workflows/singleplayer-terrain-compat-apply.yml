name: Apply singleplayer terrain compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply-singleplayer-terrain-compat.py'
      - '.github/workflows/singleplayer-terrain-compat-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/coal-progression
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply compatibility patch
        run: python tools/apply-singleplayer-terrain-compat.py
      - name: JavaScript syntax
        run: |
          set -e
          for file in src/*.js; do node --check "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          for file in server/*.mjs; do node --check "$file"; done
      - name: Install logic dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Logic/server/worker regressions
        run: npm run test:logic
      - name: Commit compatibility fix and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply-singleplayer-terrain-compat.py .github/workflows/singleplayer-terrain-compat-apply.yml
          git add src/terrain-generator.js src/world-save-compatibility.js src/client-gameplay-runtime.js src/world.js src/world-worker.js src/main.js scripts/check-terrain-generator.mjs scripts/check-singleplayer-terrain-version.mjs
          git commit -m 'fix: pin terrain versions for singleplayer saves'
          git push origin HEAD:feature/coal-progression
