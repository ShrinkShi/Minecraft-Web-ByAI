name: Patch bed runtime
on:
  push:
    branches: [feat/v0.4-bed-respawn-anchor]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.4-bed-respawn-anchor
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch bed runtime and browser coverage
        run: python scripts/patch-bed-runtime.py
      - name: Verify JavaScript syntax and bed rules
        run: |
          node --check src/main.js
          node --check tests/e2e/smoke.spec.mjs
          node scripts/check-bed.mjs
      - name: Commit product/test files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js tests/e2e/smoke.spec.mjs
          git commit -m "survival: wire bed respawn anchor interactions"
          git push origin HEAD:refs/heads/feat/v0.4-bed-respawn-anchor
