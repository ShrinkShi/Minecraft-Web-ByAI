name: Import Minecraft audio objects part 1

on:
  push:
    branches:
      - agent/import-minecraft-audio-part-1

concurrency:
  group: import-minecraft-audio-part-1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out import branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import exact uploaded object set in batches
        shell: bash
        env:
          TARGET_DIR: 原版Minecraft音频文件
          EXPECTED_COUNT: '2114'
          EXPECTED_TOTAL_BYTES: '431521776'
          EXPECTED_SET_SHA256: 34f8f17290a7e5637d8104aae26f217fddd29c4c216c23729ebf4e95df75d278
          BATCH_MAX_FILES: '175'
          BATCH_MAX_BYTES: '47185920'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotePath false

          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import csv
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.request

          TARGET = Path(os.environ["TARGET_DIR"])
          EXPECTED_COUNT = int(os.environ["EXPECTED_COUNT"])
          EXPECTED_TOTAL_BYTES = int(os.environ["EXPECTED_TOTAL_BYTES"])
          EXPECTED_SET_SHA256 = os.environ["EXPECTED_SET_SHA256"]
          BATCH_MAX_FILES = int(os.environ["BATCH_MAX_FILES"])
          BATCH_MAX_BYTES = int(os.environ["BATCH_MAX_BYTES"])
          BRANCH = os.environ["GITHUB_REF_NAME"]
          WORKFLOW = Path(".github/workflows/import-minecraft-audio-part-1.yml")

          def fetch_bytes(url: str) -> bytes:
              last = None
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Minecraft-Web-ByAI exact asset importer"},
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          return response.read()
                  except Exception as exc:
                      last = exc
                      time.sleep(min(30, 2 ** attempt))
              raise RuntimeError(f"failed to fetch {url}: {last}")

          def fetch_json(url: str):
              return json.loads(fetch_bytes(url))

          # Resolve the authoritative Minecraft Java 1.20.1 asset index.
          version_manifest = fetch_json("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
          version_entry = next(v for v in version_manifest["versions"] if v["id"] == "1.20.1")
          version_json = fetch_json(version_entry["url"])
          asset_index_url = version_json["assetIndex"]["url"]
          asset_index = fetch_json(asset_index_url)

          # The uploaded ZIP was locally verified before this workflow was created:
          # 2114 members, 431,521,776 uncompressed bytes, and every member SHA-1
          # equals its 40-character filename. Its directory split is exactly
          # 00-7f + 8a-8f + 9a-9f. Reconstruct that set from the authoritative
          # 1.20.1 asset index and require an aggregate digest match before import.
          def belongs_to_uploaded_part(hash_value: str) -> bool:
              prefix = int(hash_value[:2], 16)
              return prefix <= 0x7F or 0x8A <= prefix <= 0x8F or 0x9A <= prefix <= 0x9F

          selected: dict[str, int] = {}
          logical_by_hash: dict[str, list[str]] = {}
          for logical_path, obj in asset_index["objects"].items():
              h = obj["hash"].lower()
              size = int(obj["size"])
              logical_by_hash.setdefault(h, []).append(logical_path)
              if belongs_to_uploaded_part(h):
                  previous = selected.get(h)
                  if previous is not None and previous != size:
                      raise SystemExit(f"same hash has conflicting sizes: {h}")
                  selected[h] = size

          hashes = sorted(selected)
          set_sha256 = hashlib.sha256(("\n".join(hashes) + "\n").encode("ascii")).hexdigest()
          total_bytes = sum(selected.values())
          print(f"selected unique objects: {len(hashes)}")
          print(f"selected total bytes: {total_bytes}")
          print(f"selected set sha256: {set_sha256}")

          if len(hashes) != EXPECTED_COUNT:
              raise SystemExit(f"object-count mismatch: {len(hashes)} != {EXPECTED_COUNT}")
          if total_bytes != EXPECTED_TOTAL_BYTES:
              raise SystemExit(f"total-size mismatch: {total_bytes} != {EXPECTED_TOTAL_BYTES}")
          if set_sha256 != EXPECTED_SET_SHA256:
              raise SystemExit(f"uploaded-set digest mismatch: {set_sha256} != {EXPECTED_SET_SHA256}")

          TARGET.mkdir(parents=True, exist_ok=True)

          def verify_path(path: Path, expected_hash: str, expected_size: int) -> bool:
              if not path.exists():
                  return False
              if path.stat().st_size != expected_size:
                  raise RuntimeError(f"wrong existing size: {path}")
              digest = hashlib.sha1()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != expected_hash:
                  raise RuntimeError(f"wrong existing sha1: {path}")
              return True

          def download_one(h: str) -> tuple[str, int, bool]:
              size = selected[h]
              dest = TARGET / h[:2] / h
              dest.parent.mkdir(parents=True, exist_ok=True)
              if verify_path(dest, h, size):
                  return h, size, True

              url = f"https://resources.download.minecraft.net/{h[:2]}/{h}"
              last = None
              for attempt in range(6):
                  tmp = dest.with_suffix(".part")
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Minecraft-Web-ByAI exact asset importer"},
                      )
                      sha1 = hashlib.sha1()
                      written = 0
                      with urllib.request.urlopen(req, timeout=180) as response, tmp.open("wb") as out:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)
                              sha1.update(chunk)
                              written += len(chunk)
                      if written != size:
                          raise RuntimeError(f"size mismatch: {h}: {written} != {size}")
                      if sha1.hexdigest() != h:
                          raise RuntimeError(f"sha1 mismatch: {h}: {sha1.hexdigest()}")
                      tmp.replace(dest)
                      return h, size, False
                  except Exception as exc:
                      last = exc
                      try:
                          tmp.unlink()
                      except FileNotFoundError:
                          pass
                      time.sleep(min(30, 2 ** attempt))
              raise RuntimeError(f"failed to download {h}: {last}")

          # Create batches by both count and bytes, so each commit/push stays moderate.
          batches: list[list[str]] = []
          current: list[str] = []
          current_bytes = 0
          for h in hashes:
              size = selected[h]
              if current and (len(current) >= BATCH_MAX_FILES or current_bytes + size > BATCH_MAX_BYTES):
                  batches.append(current)
                  current = []
                  current_bytes = 0
              current.append(h)
              current_bytes += size
          if current:
              batches.append(current)

          print(f"batch count: {len(batches)}")
          for batch_no, batch in enumerate(batches, start=1):
              batch_bytes = sum(selected[h] for h in batch)
              print(f"batch {batch_no}/{len(batches)}: {len(batch)} objects, {batch_bytes} bytes")
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  list(pool.map(download_one, batch))

              paths = [str(TARGET / h[:2] / h) for h in batch]
              subprocess.run(["git", "add", "--", *paths], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode != 0:
                  subprocess.run(
                      ["git", "commit", "-m", f"assets: import Minecraft audio objects part 1 batch {batch_no}/{len(batches)}"],
                      check=True,
                  )
                  subprocess.run(["git", "push", "origin", f"HEAD:{BRANCH}"], check=True)

          # Build event-aware audio mapping from the official sounds.json.
          sounds_obj = asset_index["objects"].get("minecraft/sounds.json")
          if not sounds_obj:
              raise SystemExit("minecraft/sounds.json is missing from the official asset index")
          sounds_hash = sounds_obj["hash"].lower()
          sounds_json = json.loads(fetch_bytes(
              f"https://resources.download.minecraft.net/{sounds_hash[:2]}/{sounds_hash}"
          ))

          direct_files_by_event: dict[str, set[str]] = {}
          event_refs: dict[str, set[str]] = {}
          for event_name, event_def in sounds_json.items():
              direct_files_by_event.setdefault(event_name, set())
              event_refs.setdefault(event_name, set())
              for entry in event_def.get("sounds", []):
                  if isinstance(entry, str):
                      name = entry
                      entry_type = "file"
                  else:
                      name = entry.get("name", "")
                      entry_type = entry.get("type", "file")
                  if not name:
                      continue
                  if entry_type == "event":
                      ref = name.split(":", 1)[-1]
                      event_refs[event_name].add(ref)
                  else:
                      file_name = name.split(":", 1)[-1]
                      direct_files_by_event[event_name].add(f"minecraft/sounds/{file_name}.ogg")

          def resolve_event_files(event_name: str, stack: tuple[str, ...] = ()) -> set[str]:
              if event_name in stack:
                  return set()
              result = set(direct_files_by_event.get(event_name, set()))
              for ref in event_refs.get(event_name, set()):
                  result.update(resolve_event_files(ref, stack + (event_name,)))
              return result

          events_by_file: dict[str, list[str]] = {}
          for event_name in sounds_json:
              for logical_file in resolve_event_files(event_name):
                  events_by_file.setdefault(logical_file, []).append(event_name)
          for logical_file in events_by_file:
              events_by_file[logical_file] = sorted(set(events_by_file[logical_file]))

          manifest_path = TARGET / "对象清单-part1.txt"
          manifest_path.write_text("\n".join(hashes) + "\n", encoding="utf-8")

          audio_rows = []
          object_rows = []
          for h in hashes:
              logical_paths = sorted(logical_by_hash.get(h, []))
              object_path = f"{h[:2]}/{h}"
              object_rows.append({
                  "sha1": h,
                  "object_path": object_path,
                  "size": selected[h],
                  "logical_paths": logical_paths,
              })
              for logical_path in logical_paths:
                  if logical_path.lower().endswith(".ogg"):
                      audio_rows.append({
                          "logical_path": logical_path,
                          "sha1": h,
                          "object_path": object_path,
                          "size": selected[h],
                          "sound_events": events_by_file.get(logical_path, []),
                      })

          audio_rows.sort(key=lambda row: (row["logical_path"], row["sha1"]))
          object_rows.sort(key=lambda row: row["sha1"])

          csv_path = TARGET / "音频文件映射表.csv"
          with csv_path.open("w", encoding="utf-8-sig", newline="") as stream:
              writer = csv.writer(stream)
              writer.writerow(["Minecraft逻辑路径", "SHA-1", "仓库对象路径", "字节大小", "关联Sound Event"])
              for row in audio_rows:
                  writer.writerow([
                      row["logical_path"],
                      row["sha1"],
                      row["object_path"],
                      row["size"],
                      ";".join(row["sound_events"]),
                  ])

          json_path = TARGET / "音频文件映射表.json"
          json_path.write_text(
              json.dumps(
                  {
                      "minecraft_version": "1.20.1",
                      "asset_index_url": asset_index_url,
                      "source_part": 1,
                      "unique_objects": len(hashes),
                      "total_object_bytes": total_bytes,
                      "uploaded_set_sha256": set_sha256,
                      "audio_logical_entries": len(audio_rows),
                      "audio": audio_rows,
                      "objects": object_rows,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          unique_audio_hashes = {row["sha1"] for row in audio_rows}
          readme = f"""# 原版 Minecraft 音频文件\n\n本目录保存 Minecraft Java Edition 1.20.1 官方资源对象。对象文件保持 Mojang 原始对象库的 SHA-1 命名方式，不直接重命名，以便和官方 asset index、后续批次以及资源校验保持一一对应。\n\n## 第一批\n\n- 对象文件：{len(hashes)} 个\n- 对象总大小：{total_bytes} 字节\n- 映射到 `.ogg` 的唯一对象：{len(unique_audio_hashes)} 个\n- `.ogg` 逻辑路径映射条目：{len(audio_rows)} 条\n- 对象集合 SHA-256：`{set_sha256}`\n\n## 如何查找音效\n\n优先查看 `音频文件映射表.csv`。其中：\n\n- `Minecraft逻辑路径`：开发时最容易理解的原版资源名，例如 `minecraft/sounds/.../*.ogg`；\n- `SHA-1`：Mojang 官方对象哈希；\n- `仓库对象路径`：本目录中实际文件的位置；\n- `关联Sound Event`：从 Java 1.20.1 官方 `sounds.json` 解析得到的音效事件名，一个文件可能对应多个事件。\n\n`音频文件映射表.json` 提供同一份映射的机器可读版本，并额外记录本批全部对象对应的逻辑资源路径。`对象清单-part1.txt` 是本批上传对象的精确 SHA-1 清单。\n\n后续批次应继续保持该对象目录结构，并在导入后重新生成/扩展映射表，不要手工改名哈希对象文件。\n"""
          (TARGET / "README.md").write_text(readme, encoding="utf-8")

          subprocess.run(
              ["git", "add", "--", str(manifest_path), str(csv_path), str(json_path), str(TARGET / "README.md")],
              check=True,
          )
          subprocess.run(["git", "commit", "-m", "docs: add Minecraft audio object mappings"], check=True)
          subprocess.run(["git", "push", "origin", f"HEAD:{BRANCH}"], check=True)

          # Final exact byte verification of every object before cleanup.
          actual_hashes: list[str] = []
          actual_total = 0
          for h in hashes:
              path = TARGET / h[:2] / h
              if not path.is_file():
                  raise SystemExit(f"missing final object: {path}")
              if path.stat().st_size != selected[h]:
                  raise SystemExit(f"wrong final size: {path}")
              digest = hashlib.sha1()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != h:
                  raise SystemExit(f"wrong final sha1: {path}")
              actual_hashes.append(h)
              actual_total += path.stat().st_size

          final_set_sha256 = hashlib.sha256(("\n".join(sorted(actual_hashes)) + "\n").encode("ascii")).hexdigest()
          if len(actual_hashes) != EXPECTED_COUNT or actual_total != EXPECTED_TOTAL_BYTES or final_set_sha256 != EXPECTED_SET_SHA256:
              raise SystemExit("final exact object verification failed")

          print("IMPORT VERIFICATION PASSED")
          print(f"objects={len(actual_hashes)} bytes={actual_total} set_sha256={final_set_sha256}")
          print(f"audio_logical_entries={len(audio_rows)} unique_audio_hashes={len(unique_audio_hashes)}")

          # One-time workflow must not remain in the PR's final tree.
          subprocess.run(["git", "rm", "--", str(WORKFLOW)], check=True)
          subprocess.run(["git", "commit", "-m", "chore: remove temporary Minecraft audio import workflow"], check=True)
          subprocess.run(["git", "push", "origin", f"HEAD:{BRANCH}"], check=True)
          PY
