name: Import Minecraft audio objects part 1

on:
  push:
    branches:
      - agent/import-minecraft-audio-part-1

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out import branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Execute exact manifest importer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          runpy.run_path('.github/import-minecraft-audio-part-1.py', run_name='__main__')
          PY
