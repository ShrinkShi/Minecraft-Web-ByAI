name: Temporary singleplayer mining entry patch

on:
  push:
    branches:
      - game/v0.4-singleplayer-mining-durability
    paths:
      - .github/workflows/temp-singleplayer-mining-entry-patch.yml

permissions:
  contents: write

jobs:
  patch-main-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game/v0.4-singleplayer-mining-durability
          fetch-depth: 0
      - name: Apply exact main entry patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "import {createAuthoritativeMultiplayerGameplay,applyAuthoritativePlayerState} from './multiplayer-gameplay-adapter.js';\n",
              "import {createAuthoritativeMultiplayerGameplay,applyAuthoritativePlayerState} from './multiplayer-gameplay-adapter.js';\nimport {HOTBAR_START} from './inventory-layout.js';\nimport {SingleplayerMiningController} from './singleplayer-mining-controller.js';\n",
              'imports'
            ),
            (
              "let running=false,paused=false,last=performance.now(),selectedTarget=null,breakStart=0,lastSecond=0,frames=0,fps=0,worldInfo=null,lastAttackAt=-Infinity;",
              "let running=false,paused=false,last=performance.now(),selectedTarget=null,lastSecond=0,frames=0,fps=0,worldInfo=null,lastAttackAt=-Infinity;",
              'breakStart state'
            ),
            (
              "  onAction:intent=>handleControlIntent(intent)\n});\n",
              "  onAction:intent=>handleControlIntent(intent)\n});\nconst singleplayerMining=new SingleplayerMiningController({\n  aim:()=>aim(),\n  getMode:()=>player?.mode||'spectator',\n  getSelectedStack:()=>ui.selectedItem(),\n  breakTarget:broken=>isBedBlock(broken.id)?breakBed(broken):!!world?.setBlock(broken.x,broken.y,broken.z,0),\n  spawnDrop:(stack,broken)=>drops?.spawnStack(stack,new THREE.Vector3(broken.x+.5,broken.y+.6,broken.z+.5)),\n  damageSelected:(expectedId,amount)=>{const result=inventory?.damageAt(HOTBAR_START+ui.selected,expectedId,amount)||{changed:false,broken:false,reason:'inventory-unavailable'};if(result.changed){markSaveDirty();if(result.broken)ui.showToast(`${ITEMS[expectedId]?.name||expectedId} 已损坏`);}return result;},\n  onProgress:value=>ui.setBreak(value),\n  onBreak:({block})=>{ui.showToast(`破坏 ${block.name}`);markSaveDirty();}\n});\n",
              'controller construction'
            ),
            (
              "function spawnOverflow(stacks){if(!drops||!player)return;const origin=player.position.clone().add(new THREE.Vector3(0,1,0));for(const stack of stacks)drops.spawn(stack.id,stack.count,origin.clone());}",
              "function spawnOverflow(stacks){if(!drops||!player)return;const origin=player.position.clone().add(new THREE.Vector3(0,1,0));for(const stack of stacks)drops.spawnStack(stack,origin.clone());}",
              'overflow drop instances'
            ),
            (
              "      const origin=deathPosition.clone().add(new THREE.Vector3(0,.5,0));for(const stack of stacks)drops?.spawn(stack.id,stack.count,origin.clone());if(plan.droppedXp>0)experienceOrbs?.spawn(plan.droppedXp,origin.clone().add(new THREE.Vector3(0,.2,0)));",
              "      const origin=deathPosition.clone().add(new THREE.Vector3(0,.5,0));for(const stack of stacks)drops?.spawnStack(stack,origin.clone());if(plan.droppedXp>0)experienceOrbs?.spawn(plan.droppedXp,origin.clone().add(new THREE.Vector3(0,.2,0)));",
              'death drop instances'
            ),
            (
              "function primaryActionStart(){\n  if(sessionKind==='multiplayer'){ui.showToast('联机方块/战斗权威尚未接入');return;}if(!canControl()||!player||player.mode==='spectator')return;const entityHit=aimEntity(),blockHit=aim();\n  if(entityHit&&(!blockHit||entityHit.distance<=blockHit.distance)){const now=performance.now();breakStart=0;ui.setBreak(0);if(player.mode!=='creative'&&!canAttack(lastAttackAt,now))return;lastAttackAt=now;const selected=ui.selectedItem(),damage=player.mode==='creative'?100:(ITEMS[selected?.id]?.attackDamage||1);entityHit.system.hurt(entityHit.entity,damage,player.position,now);return;}\n  if(player.mode!=='adventure')breakStart=performance.now();\n}\nfunction primaryActionEnd(){breakStart=0;ui.setBreak(0);}",
              "function primaryActionStart(){\n  if(sessionKind==='multiplayer'){ui.showToast('联机方块/战斗权威尚未接入');return;}if(!canControl()||!player||player.mode==='spectator')return;const entityHit=aimEntity(),blockHit=aim();\n  if(entityHit&&(!blockHit||entityHit.distance<=blockHit.distance)){const now=performance.now();singleplayerMining.cancel();selectedTarget=null;if(player.mode!=='creative'&&!canAttack(lastAttackAt,now))return;lastAttackAt=now;const selected=ui.selectedItem(),damage=player.mode==='creative'?100:(ITEMS[selected?.id]?.attackDamage||1);entityHit.system.hurt(entityHit.entity,damage,player.position,now);return;}\n  if(player.mode!=='adventure')singleplayerMining.start(performance.now());\n}\nfunction primaryActionEnd(){singleplayerMining.cancel();selectedTarget=null;}",
              'primary mining input'
            ),
            (
              "function toolMultiplier(blockId){const block=BLOCKS[blockId],selected=ui.selectedItem(),tool=ITEMS[selected?.id]?.tool;if(!tool)return 1;if(block?.requires===tool.kind)return 2.5*tool.speed;return 1.2;}\nfunction canHarvest(blockId){const block=BLOCKS[blockId];if(!block?.requires)return true;return ITEMS[ui.selectedItem()?.id]?.tool?.kind===block.requires;}\nfunction interaction(now){if(sessionKind!=='singleplayer'||!canControl()||!player||player.mode==='spectator'||player.mode==='adventure'){ui.setBreak(0);return;}selectedTarget=aim();if(!breakStart||!selectedTarget){ui.setBreak(0);return;}const block=BLOCKS[selectedTarget.id],hardness=block?.hardness||1,creative=player.mode==='creative',duration=creative?70:Math.max(120,hardness*900/toolMultiplier(selectedTarget.id)),progress=(now-breakStart)/duration;ui.setBreak(Math.min(1,progress));if(progress>=1){const broken={...selectedTarget},removed=isBedBlock(broken.id)?breakBed(broken):world.setBlock(broken.x,broken.y,broken.z,0);if(removed){if(player.mode!=='creative'&&canHarvest(broken.id)&&block?.drops)drops.spawn(block.drops,1,new THREE.Vector3(broken.x+.5,broken.y+.6,broken.z+.5));ui.showToast(`破坏 ${block.name}`);markSaveDirty();}breakStart=now+70;}}",
              "function interaction(now){if(sessionKind!=='singleplayer'||!canControl()||!player){singleplayerMining.cancel();selectedTarget=null;return;}const state=singleplayerMining.step(now);selectedTarget=state.target;}",
              'singleplayer interaction loop'
            ),
            (
              "function dropSelected(){if(sessionKind==='multiplayer'){ui.showToast('联机丢弃/物品权威尚未接入');return;}const selected=ui.selectedItem();if(!selected||!drops||!player)return;const stack=player.mode==='creative'?{id:selected.id,count:1}:ui.consumeSelected(1);if(!stack)return;const dir=player.lookDirection(new THREE.Vector3()),origin=player.eyePosition(new THREE.Vector3()).addScaledVector(dir,.55),velocity=dir.clone().multiplyScalar(4).add(new THREE.Vector3(0,1.5,0));drops.spawn(stack.id,stack.count,origin,velocity);markSaveDirty();}",
              "function dropSelected(){if(sessionKind==='multiplayer'){ui.showToast('联机丢弃/物品权威尚未接入');return;}const selected=ui.selectedItem();if(!selected||!drops||!player)return;const stack=player.mode==='creative'?{...selected,count:1}:ui.consumeSelected(1);if(!stack)return;const dir=player.lookDirection(new THREE.Vector3()),origin=player.eyePosition(new THREE.Vector3()).addScaledVector(dir,.55),velocity=dir.clone().multiplyScalar(4).add(new THREE.Vector3(0,1.5,0));drops.spawnStack(stack,origin,velocity);markSaveDirty();}",
              'Q drop instances'
            )
          ]

          for old, new, label in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected exactly one old fragment, found {count}')
            text = text.replace(old, new, 1)

          forbidden = ['function toolMultiplier(', 'function canHarvest(', 'breakStart=']
          for token in forbidden:
            if token in text:
              raise SystemExit(f'forbidden legacy mining token remains: {token}')

          path.write_text(text, encoding='utf-8')
      - name: Validate patched entry
        run: |
          node --check src/main.js
          grep -q "SingleplayerMiningController" src/main.js
          grep -q "drops.spawnStack(stack,origin,velocity)" src/main.js
      - name: Commit patched entry
        run: |
          if git diff --quiet -- src/main.js; then
            echo "No src/main.js changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "game: route singleplayer mining through shared durability controller"
          git push origin HEAD:game/v0.4-singleplayer-mining-durability
