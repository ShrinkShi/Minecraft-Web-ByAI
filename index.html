<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Minecraft Web By AI</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./jade.css" />
  <link rel="stylesheet" href="./armor.css" />
  <link rel="stylesheet" href="./oxygen.css" />
  <link rel="stylesheet" href="./death.css" />
  <link rel="stylesheet" href="./mobile.css" />
  <link rel="stylesheet" href="./multiplayer.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="3D 游戏画布"></canvas>

    <section id="main-menu" class="screen active">
      <div class="menu-backdrop"></div>
      <div class="menu-panel">
        <div class="mc-logo-text" aria-label="Minecraft">MINECRAFT</div>
        <div class="splash">Web Edition · 现代浏览器体素引擎</div>
        <button class="mc-button primary" data-action="singleplayer">单人游戏</button>
        <button class="mc-button" data-action="multiplayer">多人游戏</button>
        <button class="mc-button" data-action="realms">Minecraft Realms</button>
        <div class="button-row">
          <button class="mc-button" data-action="options">选项</button>
          <button class="mc-button" data-action="quit">退出游戏</button>
        </div>
        <p class="legal-note">Minecraft Web By AI — 学习与技术研究项目。当前演示使用用户提供的资源作为参考。</p>
      </div>
    </section>

    <section id="world-menu" class="screen">
      <div class="world-card">
        <h1>创建 / 进入世界</h1>
        <label>世界名称<input id="world-name" value="新的世界" maxlength="40" /></label>
        <label>种子<input id="world-seed" value="ShrinkCraft-2026" maxlength="80" /></label>
        <label>游戏模式
          <select id="game-mode"><option value="survival">生存</option><option value="creative">创造</option></select>
        </label>
        <label>AI 地形提示词 <span class="hint">（首版映射到程序化参数，扩散模型接口后续接入）</span>
          <textarea id="terrain-prompt">温带森林，起伏丘陵，河谷与少量沙地</textarea>
        </label>
        <div class="button-row">
          <button class="mc-button" data-action="create-world">创建 / 进入</button>
          <button class="mc-button" data-action="back-main">取消</button>
        </div>
      </div>
    </section>

    <section id="multiplayer-menu" class="screen">
      <div class="world-card">
        <h1>连接多人服务器</h1>
        <label>WebSocket 服务器地址
          <input id="multiplayer-url" value="ws://127.0.0.1:8080/ws" maxlength="300" spellcheck="false" autocomplete="off" />
        </label>
        <label class="multiplayer-checkbox"><input id="multiplayer-insecure" type="checkbox" /> 明确允许本地 / 开发环境使用明文 ws://</label>
        <p id="multiplayer-status" class="multiplayer-status" role="status" aria-live="polite">未连接</p>
        <p class="hint">当前多人阶段已由服务器权威处理移动、普通方块挖掘/放置、生存掉落物与背包同步；战斗、联机命令、工作台/床等高级交互仍在继续服务端化。</p>
        <div class="button-row">
          <button class="mc-button primary" data-action="connect-multiplayer">连接服务器</button>
          <button class="mc-button" data-action="back-main">取消</button>
        </div>
      </div>
    </section>

    <section id="pause-menu" class="screen pause-layer">
      <div class="pause-card">
        <h2>游戏菜单</h2>
        <button class="mc-button" data-action="resume">返回游戏</button>
        <button class="mc-button" data-action="options">选项</button>
        <button id="return-main-button" class="mc-button" data-action="save-main">保存并返回标题画面</button>
      </div>
    </section>

    <section id="death-menu" class="screen death-layer" aria-label="死亡界面">
      <div class="death-card">
        <h1>你死了！</h1>
        <p id="death-reason">你死了</p>
        <p id="death-detail" class="death-detail"></p>
        <button class="mc-button primary" data-action="respawn">重生</button>
        <button class="mc-button" data-action="death-main">返回标题画面</button>
      </div>
    </section>

    <div id="loading" class="loading hidden">
      <div class="loading-card"><strong id="loading-title">正在生成世界...</strong><div class="progress"><span id="loading-bar"></span></div><small id="loading-detail">准备区块</small></div>
    </div>

    <div id="hud" class="hud hidden">
      <div id="crosshair" class="crosshair"></div>
      <div id="jade-hud" class="jade-hud hidden" role="status" aria-live="off">
        <div class="jade-icon"></div>
        <div class="jade-main">
          <div class="jade-name"></div>
          <div class="jade-source">Minecraft Web By AI</div>
          <div class="jade-health hidden"><div class="jade-health-fill"></div><span class="jade-health-text"></span></div>
          <div class="jade-details"></div>
        </div>
      </div>
      <div id="debug" class="debug"></div>
      <div id="chat-log" class="chat-log"></div>
      <div class="status-stack">
        <div id="armor-row" class="icon-row armor-row"></div>
        <div class="status-row"><div id="hearts" class="icon-row hearts"></div><div id="hunger" class="icon-row hunger"></div></div>
        <div class="xp-wrap"><div id="xp-bar" class="xp-bar"></div><span id="xp-level">0</span></div>
        <div id="hotbar" class="hotbar"></div>
      </div>
      <div id="oxygen" class="oxygen hidden"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="break-meter" class="break-meter hidden"><span></span></div>
    </div>

    <section id="inventory" class="inventory hidden" aria-label="物品栏">
      <div class="inventory-panel">
        <button class="mobile-panel-close" data-action="mobile-close-panel" aria-label="关闭物品栏">×</button>
        <div class="inventory-title">物品栏</div>
        <div class="inventory-top">
          <div id="equipment-slots" class="equipment-slots" aria-label="护甲槽"></div>
          <div class="player-preview">玩家</div>
          <div class="crafting-area"><span>2 × 2 合成</span><div class="crafting-line"><div id="craft-grid-2" class="craft-grid grid-2"></div><b>→</b><div id="craft-result-2" class="craft-result"></div></div></div>
        </div>
        <div id="inventory-grid" class="inventory-grid"></div>
        <div id="inventory-hotbar" class="inventory-grid inventory-hotbar"></div>
      </div>
    </section>

    <section id="workbench" class="inventory hidden" aria-label="工作台">
      <div class="inventory-panel workbench-panel">
        <button class="mobile-panel-close" data-action="mobile-close-panel" aria-label="关闭工作台">×</button>
        <div class="inventory-title">工作台</div>
        <div class="workbench-craft"><div id="craft-grid-3" class="craft-grid grid-3"></div><b>→</b><div id="craft-result-3" class="craft-result"></div></div>
        <div id="workbench-grid" class="inventory-grid"></div>
        <div id="workbench-hotbar" class="inventory-grid inventory-hotbar"></div>
      </div>
    </section>

    <div id="rotate-device" class="rotate-device" role="status" aria-live="polite"><div class="rotate-device-card"><strong>请将手机横屏</strong><span>横屏后会自动切换到触控游戏布局。</span></div></div>
    <div id="mobile-controls" class="mobile-controls hidden" aria-label="手机触控操作" aria-hidden="true">
      <div id="mobile-look-zone" class="mobile-look-zone" aria-label="拖动调整视角"></div>
      <div id="mobile-joystick" class="mobile-joystick" aria-label="移动摇杆"><span id="mobile-joystick-knob" class="mobile-joystick-knob"></span></div>
      <div class="mobile-top-actions">
        <button class="mobile-control-button" data-mobile-action="pause">暂停</button><button class="mobile-control-button" data-mobile-action="inventory">背包</button><button class="mobile-control-button" data-mobile-action="chat">聊天</button><button class="mobile-control-button" data-mobile-action="view">视角</button>
      </div>
      <div class="mobile-action-cluster">
        <button class="mobile-control-button" data-mobile-hold="attack">攻击</button><button class="mobile-control-button" data-mobile-action="use">使用</button><button class="mobile-control-button" data-mobile-hold="jump">跳</button><button class="mobile-control-button" data-mobile-toggle="sprint" aria-pressed="false">跑</button><button class="mobile-control-button" data-mobile-toggle="sneak" aria-pressed="false">潜</button><button class="mobile-control-button" data-mobile-action="drop">丢</button>
      </div>
    </div>
    <div id="cursor-stack" class="cursor-stack hidden"></div>
    <div id="chat-input-wrap" class="chat-input-wrap hidden"><input id="chat-input" autocomplete="off" spellcheck="false" maxlength="256" /><button class="mobile-chat-close" data-action="mobile-close-chat" aria-label="关闭聊天">×</button></div>
  </div>
  <script type="importmap">
    {"imports":{"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js":"./vendor/three.module.js"}}
  </script>
  <script type="module" src="./src/browser-bootstrap.js"></script>
</body>
</html>
